
name: Test Daily CORe T2M

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-t2m:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            xarray \
            netCDF4 \
            eccodes \
            requests

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: tropico-atmospheric-monitor
          workload_identity_provider: projects/490419539543/locations/global/workloadIdentityPools/gam-github-pool/providers/github-actions
          service_account: gam-climatology-reader@tropico-atmospheric-monitor.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false

      - name: Calculate daily temperature anomaly
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python scripts/update_daily_core.py

      - name: Upload test product
        uses: actions/upload-artifact@v4
        with:
          name: t2m-daily-preview
          path: data/latest/t2m.json
          if-no-files-found: error
