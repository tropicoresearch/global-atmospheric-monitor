
name: Update Global Atmospheric Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-atmospheric-monitor-pages
  cancel-in-progress: false

jobs:

  # ========================================================
  # 1. PROCESS DAILY ATMOSPHERIC DATA
  # ========================================================

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            xarray \
            netCDF4 \
            eccodes \
            requests

      # ----------------------------------------------------
      # Authenticate using Workload Identity Federation
      # ----------------------------------------------------

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: tropico-atmospheric-monitor
          workload_identity_provider: projects/490419539543/locations/global/workloadIdentityPools/gam-github-pool/providers/github-actions
          service_account: gam-climatology-reader@tropico-atmospheric-monitor.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false

      # ----------------------------------------------------
      # Calculate daily T2M anomalies
      # ----------------------------------------------------

      - name: Process daily CORe temperature
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python scripts/update_daily_core.py

      # ----------------------------------------------------
      # Validate output
      # ----------------------------------------------------

      - name: Validate visualization data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/latest/t2m.json")

          if not path.is_file():
              raise FileNotFoundError(path)

          with path.open(encoding="utf-8") as f:
              data = json.load(f)

          assert data["variable"] == "t2m"
          assert data["units"] == "degC"
          assert data["shape"] == [256, 512]
          assert len(data["lat"]) == 256
          assert len(data["lon"]) == 512
          assert len(data["anomaly"]) == 256
          assert all(
              len(row) == 512
              for row in data["anomaly"]
          )

          print("Global Atmospheric Monitor")
          print("--------------------------")
          print(f"Variable: {data['variable']}")
          print(f"Date: {data['date']}")
          print(f"Grid: {data['shape']}")
          print(f"Size: {path.stat().st_size:,} bytes")
          print("SUCCESS: Visualization data validated")
          PY

      # ----------------------------------------------------
      # Assemble public website
      # ----------------------------------------------------

      - name: Prepare GitHub Pages
        run: |
          mkdir -p _site/data/latest

          cp index.html _site/
          cp privacy.html _site/

          if [ -d css ]; then
            cp -R css _site/
          fi

          if [ -d js ]; then
            cp -R js _site/
          fi

          if [ -d assets ]; then
            cp -R assets _site/
          fi

          cp data/latest/*.json _site/data/latest/

          touch _site/.nojekyll

          echo "Checking public atmospheric products:"
          ls -lh _site/data/latest/

          test -f _site/data/latest/manifest.json

          for variable in \
            t2m prate pwat \
            u850 v850 u250 v250 \
            wspd850 wspd250 z500 omega500
          do
            test -f "_site/data/latest/${variable}.json"
          done

          echo "SUCCESS: All 12 JSON products ready"


      # ----------------------------------------------------
      # Upload GitHub Pages artifact
      # ----------------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site


  # ========================================================
  # 2. DEPLOY PUBLIC WEBSITE
  # ========================================================

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
