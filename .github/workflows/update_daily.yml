
name: Update Global Atmospheric Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "23 12 * * *"

permissions:
  contents: read

concurrency:
  group: global-atmospheric-monitor-pages
  cancel-in-progress: false

jobs:

  # ========================================================
  # 1. PROCESS DAILY ATMOSPHERIC DATA
  # ========================================================

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy \
            xarray \
            netCDF4 \
            eccodes \
            requests

      # ----------------------------------------------------
      # Authenticate with Google Cloud
      # ----------------------------------------------------

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: tropico-atmospheric-monitor
          workload_identity_provider: projects/490419539543/locations/global/workloadIdentityPools/gam-github-pool/providers/github-actions
          service_account: gam-climatology-reader@tropico-atmospheric-monitor.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false

      # ----------------------------------------------------
      # Process daily NOAA CPC CORe products
      # ----------------------------------------------------

      - name: Process daily atmospheric data
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python scripts/update_daily_core.py

      # ----------------------------------------------------
      # Validate all atmospheric products
      # ----------------------------------------------------

      - name: Validate atmospheric data
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          folder = Path("data/latest")

          variables = [
              "t2m",
              "prate",
              "pwat",
              "u850",
              "v850",
              "u250",
              "v250",
              "wspd850",
              "wspd250",
              "z500",
              "omega500",
          ]

          wind_layers = ["wind850", "wind250"]

          with (folder / "manifest.json").open(
              encoding="utf-8"
          ) as f:
              manifest = json.load(f)

          assert set(manifest["variables"]) == set(variables)
          assert set(manifest["wind_layers"]) == set(wind_layers)

          date = manifest["date"]
          shape = [256, 512]

          print("=" * 60)
          print("GLOBAL ATMOSPHERIC MONITOR")
          print(f"Analysis date: {date}")
          print("=" * 60)

          # Validate all 11 anomaly products.

          for name in variables:

              path = folder / f"{name}.json"

              with path.open(encoding="utf-8") as f:
                  data = json.load(f)

              assert data["variable"] == name
              assert data["date"] == date
              assert data["shape"] == shape
              assert len(data["lat"]) == 256
              assert len(data["lon"]) == 512

              values = data["anomaly"]

              assert len(values) == 256

              valid = 0

              for row in values:
                  assert len(row) == 512

                  for value in row:
                      if value is not None:
                          assert isinstance(value, (int, float))
                          assert math.isfinite(value)
                          valid += 1

              assert valid > 0

              print(
                  f"SUCCESS {name:10s}: "
                  f"{valid:,} valid anomaly cells"
              )

          # Validate original wind vector products.

          for name in wind_layers:

              path = folder / f"{name}.json"

              with path.open(encoding="utf-8") as f:
                  data = json.load(f)

              assert data["variable"] == name
              assert data["date"] == date
              assert data["shape"] == shape
              assert data["units"] == "m/s"
              assert (
                  data["field_type"]
                  == "original_daily_mean_wind"
              )

              assert len(data["lat"]) == 256
              assert len(data["lon"]) == 512

              expected_level = int(name.replace("wind", ""))

              assert data["level_hpa"] == expected_level

              u = data["u"]
              v = data["v"]

              assert len(u) == 256
              assert len(v) == 256

              valid = 0

              for urow, vrow in zip(u, v):

                  assert len(urow) == 512
                  assert len(vrow) == 512

                  for uu, vv in zip(urow, vrow):

                      assert (uu is None) == (vv is None)

                      if uu is not None:
                          assert math.isfinite(uu)
                          assert math.isfinite(vv)
                          valid += 1

              assert valid > 0

              print(
                  f"SUCCESS {name:10s}: "
                  f"{valid:,} valid wind vectors"
              )

          print("=" * 60)
          print("SUCCESS: All 11 anomaly products validated")
          print("SUCCESS: Both wind layers validated")
          print("SUCCESS: All products use the same date")
          print("SUCCESS: manifest.json validated")
          PY

      # ----------------------------------------------------
      # Assemble public website
      # ----------------------------------------------------

      - name: Prepare GitHub Pages
        run: |
          mkdir -p _site/data/latest

          # Complete HTML: CSS and JavaScript are embedded.
          cp index.html _site/

          # Images, logos and author portrait.
          cp -R assets _site/

          # Atmospheric data products.
          cp data/latest/*.json _site/data/latest/

          # Disable Jekyll processing.
          touch _site/.nojekyll

          echo "Checking published files:"
          ls -lh _site/
          ls -lh _site/data/latest/

          test -f _site/index.html
          test -f _site/data/latest/manifest.json

          for variable in \
            t2m prate pwat \
            u850 v850 u250 v250 \
            wspd850 wspd250 \
            z500 omega500 \
            wind850 wind250
          do
            test -f "_site/data/latest/${variable}.json"
          done

          echo "SUCCESS: 11 anomaly products ready"
          echo "SUCCESS: 2 wind vector products ready"
          echo "SUCCESS: 1 manifest ready"
          echo "SUCCESS: Website ready for deployment"

      # ----------------------------------------------------
      # Upload GitHub Pages artifact
      # ----------------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # ========================================================
  # 2. DEPLOY PUBLIC WEBSITE
  # ========================================================

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
